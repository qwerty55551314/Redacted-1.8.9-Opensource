plugins {
    id 'java'
    id 'application'
    // Produces a self-contained runnable jar (classes + all deps + LWJGL natives).
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'cn.timer'
version = '1.0-SNAPSHOT'

ext {
    lwjglVersion = '3.4.3'
    lombokVersion = '1.18.46'
    lwjglModules = ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-openal', 'lwjgl-opengles', 'lwjgl-opencl', 'lwjgl-tinyexr']
    lwjglNativeModules = ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-openal', 'lwjgl-opengles']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
}

application {
    mainClass = 'Start'
}

dependencies {
    // Celeritas terrain renderer core (Sodium/Embeddium-based) + its deps
    implementation files('libs/celeritas-core.jar')
    implementation files('libs/joml-1.10.5.jar')
    implementation files('libs/fastutil-7.1.0.jar')

    // ReplayMod shaded libraries (replaystudio, isoparser, jackson, etc.)
    implementation files('libs/replaymod-libs.jar')

    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    // Microsoft OAuth via OkHttp
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    // Minecraft libraries from libraries.minecraft.net (pinned by Mojang; no newer releases exist)
    implementation 'com.mojang:authlib:1.5.21'
    implementation 'com.paulscode:codecjorbis:20101023'
    implementation 'com.paulscode:codecwav:20101023'
    implementation 'com.paulscode:libraryjavasound:20101123'
    implementation 'com.paulscode:soundsystem:20120107'
    implementation 'com.ibm.icu:icu4j-core-mojang:51.2'

    // Standard runtime libraries
    implementation 'commons-codec:commons-codec:1.22.1'
    // commons-io 2.12+ changed readLines(InputStream, Charset) to throw UncheckedIOException instead of
    // IOException, which breaks 1.8.9 vanilla source (it declares catch(IOException)). 2.11.0 is the newest
    // version that keeps the checked signature.
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-logging:commons-logging:1.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    // Guava is pinned to 17.0 by Minecraft 1.8.9 itself: the vanilla source depends on APIs
    // that later Guava versions removed (Futures.addCallback 2-arg, public Iterators.emptyIterator).
    // Bumping it breaks ~40 vanilla call sites, so it stays at the version Mojang ships for 1.8.9.
    implementation 'com.google.guava:guava:17.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    // Route SLF4J calls (oshi-core uses slf4j-api 1.7) into log4j2 so they aren't dropped by the
    // no-op fallback (which printed "Failed to load class ...StaticLoggerBinder" on startup).
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.26.1'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'io.netty:netty-all:4.1.137.Final'
    implementation 'com.github.dblock:oshi-core:3.4.0'
    // antlr pinned to 4.9.2: the Sxf grammar in src/stelix/xfile/gen was generated by ANTLR 4.9.2 and its
    // generated code calls RuntimeMetaData.checkVersion("4.9.2", ...) at class-load, which throws on a newer
    // runtime. Regenerate the grammar with a newer ANTLR before bumping this.
    implementation 'org.antlr:antlr4:4.9.2'

    // LWJGL 3 APIs
    lwjglModules.each { moduleName ->
        implementation "org.lwjgl:${moduleName}"
    }

    // LWJGL 3 natives. We bundle EVERY platform's natives into the fat jar (not just the host OS),
    // so the shipped client is cross-platform. LWJGL extracts the right .so/.dll/.dylib for the
    // running OS at startup.
    def nativeClassifiers = ['natives-linux', 'natives-linux-arm32', 'natives-linux-arm64',
                             'natives-windows', 'natives-windows-x86', 'natives-windows-arm64',
                             'natives-macos', 'natives-macos-arm64']
    lwjglNativeModules.each { moduleName ->
        nativeClassifiers.each { classifier ->
            runtimeOnly "org.lwjgl:${moduleName}:${lwjglVersion}:${classifier}"
        }
    }

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // NOTE: `--release 8` was removed on purpose. The client runs on a JDK 21 runtime and the
    // Celeritas renderer jar ships Java 21 bytecode (records). Using --release 8 hides
    // java.lang.Record and makes javac refuse to read those classes from the classpath.
    // sourceCompatibility/targetCompatibility (1.8) are kept so the game sources still emit
    // Java 8 bytecode, but the compiler can see the newer library classes.
}

tasks.named('run', JavaExec).configure {
    workingDir = file('run')
    doFirst {
        workingDir.mkdirs()
    }
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs Minecraft 1.8.9 with the LWJGL 3 runtime classpath.'
    mainClass = application.mainClass
    classpath = sourceSets.main.runtimeClasspath
    workingDir = file('run')
    // OptiFine's NativeMemory reads jdk.internal.misc.VM.maxDirectMemory() / SharedSecrets for its direct-buffer
    // debug stats. On JDK 9+ that package is module-private; open it so the reflection succeeds (otherwise it
    // just logs a cascade of ClassNotFoundException/InaccessibleObjectException warnings on startup).
    jvmArgs '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED'
    jvmArgs '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    doFirst {
        workingDir.mkdirs()
    }
}

// `gradlew shadowJar` -> build/libs/RedactedClient.jar : a single runnable jar containing the
// client classes, every runtime dependency, and every platform's LWJGL natives.
// Run with `java -jar RedactedClient.jar` from a `run/`-style working dir.
shadowJar {
    archiveBaseName = 'RedactedClient'
    archiveClassifier = ''     // no "-all" suffix
    archiveVersion = ''        // -> exactly "RedactedClient.jar"
    manifest {
        attributes 'Main-Class': 'Start'
    }
    // netty / log4j ship META-INF/services entries; without merging, ServiceLoader
    // lookups break in a shaded jar.
    mergeServiceFiles()
}

// DEBUG BUILD (packet logging, debug-only features)
// Compiles src-debug/ against main output.  At runtime the debug class files
// are placed *first* on the classpath.  Production code calls DebugUtil (always
// present) which uses reflection to load PacketDump - so the normal jar has
// zero traces of the debug-only class.
// The normal `runClient` and `jar` tasks are completely unaffected.

task compileDebug(type: JavaCompile) {
    description = 'Compiles src-debug/ sources (packet dumper, debug utils).'
    source file('src-debug')
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = file("$buildDir/classes/java/debug")
}

task debugRunClient(type: JavaExec) {
    group = 'application'
    description = 'Runs client with debug features (packet dumper, etc.).  Set DEBUG_PACKETS=true env var to activate logging.'
    dependsOn 'classes'
    dependsOn 'compileDebug'
    mainClass = application.mainClass
    classpath = files("$buildDir/classes/java/debug") + sourceSets.main.runtimeClasspath
    workingDir = file('run')
    doFirst {
        workingDir.mkdirs()
    }
}
